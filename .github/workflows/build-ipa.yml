name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Shelv.xcodeproj \
            -scheme Shelv \
            -configuration Release \
            -archivePath Shelv.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            | tail -50

      - name: Create ExportOptions
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath Shelv.xcarchive \
            -exportPath output \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 || true

          # If xcodebuild export fails, manually create IPA from archive
          if [ ! -f output/Shelv.ipa ]; then
            echo "xcodebuild export failed, creating IPA manually..."
            mkdir -p Payload
            cp -R Shelv.xcarchive/Products/Applications/Shelv.app Payload/
            zip -r Shelv.ipa Payload
            mv Shelv.ipa output/Shelv.ipa 2>/dev/null || mkdir -p output && mv Shelv.ipa output/
            rm -rf Payload
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shelv-IPA
          path: output/*.ipa
          retention-days: 30
