name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          # List available Xcode versions and pick the latest
          ls -d /Applications/Xcode*.app 2>/dev/null
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Resolve Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Shelv.xcodeproj \
            -scheme Shelv

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Shelv.xcodeproj \
            -scheme Shelv \
            -configuration Release \
            -archivePath $PWD/build/Shelv.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO

      - name: Create IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -R $PWD/build/Shelv.xcarchive/Products/Applications/Shelv.app $PWD/build/Payload/
          cd $PWD/build
          zip -r Shelv.ipa Payload
          ls -la Shelv.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shelv-IPA
          path: build/Shelv.ipa
          retention-days: 30
